[project]
name = "yolo-vision-studio-backend"
version = "1.0.0"
description = "FastAPI backend for YOLO Vision Studio"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py310"
